name: Check Mapbox secret
on:
  push:
    branches: [check-mapbox-secret]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Is the secret set (prints only yes or no)
        env:
          T: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "MAPBOX_SECRET=missing"; exit 1; fi
          case "$T" in pk.*) echo "MAPBOX_SECRET=set, public token (pk)";; *) echo "MAPBOX_SECRET=set, but does not start with pk"; exit 1;; esac
