name: CI

# macOS is the slow runner (about 25 minutes, and it queues). Pure-logic tests run on
# Linux in core-tests.yml.
#
# What runs where:
# - Pull request: build the app and run the unit tests (larpingTests), except the full
#   video export test (ShareVideoComposerTests/testCompleteExportProducesReadablePortraitMP4,
#   about 69 seconds on its own). About 3 minutes in total.
# - Push to main and by hand: everything, including that video test and the UI tests
#   (larpingUITests), which boot the whole app in the simulator and take about 7
#   minutes on their own. A UI or video-export regression is therefore caught right
#   after the merge, not before it. Run this workflow by hand on the branch if a pull
#   request touches screens or the video composer.
#
# Rules:
# 1. A pull request that only touches documentation, images or the Linux job
#    skips macOS (paths-ignore). Anything else, including a change to this file,
#    runs it.
# 2. A newer commit on the same pull request cancels the older macOS run.
#
# Note: when GitHub skips this workflow by path, no check appears at all. A pull
# request with only the Linux check was therefore NOT built on macOS. Look for
# the "build-and-test" check before trusting a change to app code.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "design/**"
      - ".github/workflows/core-tests.yml"
      - "scripts/test-core-logic.sh"
      - "CoreLogic/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "design/**"
      - ".github/workflows/core-tests.yml"
      - "scripts/test-core-logic.sh"
      - "CoreLogic/**"
      - "LICENSE"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -project larping.xcodeproj -scheme larping \
            -destination 'generic/platform=iOS Simulator' -configuration Debug build \
            2>&1 | tee build.log | grep -Ei "error:|BUILD SUCCEEDED|BUILD FAILED"
          ! grep -q "BUILD FAILED" build.log

      - name: Prepare Simulator
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl boot "iPhone 17" || true
          xcrun simctl bootstatus "iPhone 17" -b

      - name: Test
        env:
          # Pull requests run the unit tests only, minus the slow full video export.
          # Pushes to main and manual runs also run the video export and the UI tests.
          ONLY: ${{ github.event_name == 'pull_request' && '-only-testing:larpingTests -skip-testing:larpingTests/ShareVideoComposerTests/testCompleteExportProducesReadablePortraitMP4' || '' }}
        run: |
          xcodebuild -project larping.xcodeproj -scheme larping \
            -destination 'platform=iOS Simulator,name=iPhone 17' -parallel-testing-enabled NO \
            $ONLY test \
            2>&1 | tee test.log | grep -Ei "error:|failed|TEST SUCCEEDED"
          ! grep -q "TEST FAILED" test.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: larping-test-logs
          path: test.log
          if-no-files-found: warn
